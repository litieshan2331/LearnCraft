# LearnCraft 生产应用编排。
# 服务：Web、TypeScript Outbox Dispatcher（agent-dispatcher-ts）与 TypeScript Agent Worker（agent-worker-ts）。
# 只有一套 Agent 运行时：Dispatcher 领取全部 Outbox 事件，未注册的 run_type 会明确失败而不是无人领取。
# 外部依赖：PostgreSQL、认证 Redis、队列 Redis 与对象存储均由环境变量提供，不在此文件创建。

name: ${COMPOSE_PROJECT_NAME:-learncraft-production}

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:?set APP_VERSION in .env.production}
      GIT_SHA: ${GIT_SHA:?set GIT_SHA in .env.production}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env.production}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env.production}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env.production}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:?set CREDENTIAL_ENCRYPTION_KEY_VERSION in .env.production}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, private]

  agent-dispatcher-ts:
    build:
      context: ..
      dockerfile: infra/docker/agent-worker-ts.Dockerfile
    command: ["node", "dist/dispatcher.js"]
    restart: unless-stopped
    environment:
      # 健康端点与版本接口使用的非敏感构建标识。
      APP_VERSION: ${APP_VERSION:?set APP_VERSION in .env.production}
      GIT_SHA: ${GIT_SHA:?set GIT_SHA in .env.production}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      # BullMQ 连接串：必须与 agent-worker-ts 指向同一个 Redis 实例与 db。
      AGENT_QUEUE_REDIS_URL: ${AGENT_QUEUE_REDIS_URL:?set AGENT_QUEUE_REDIS_URL in .env.production}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent.run}
      AGENT_SHORT_QUEUE_NAME: ${AGENT_SHORT_QUEUE_NAME:-agent.run}
      AGENT_LONG_QUEUE_NAME: ${AGENT_LONG_QUEUE_NAME:-agent.run.long}
      AGENT_QUEUE_PREFIX: ${AGENT_QUEUE_PREFIX:-learncraft:agent-queue}
      OUTBOX_DISPATCHER_ID_TS: ${OUTBOX_DISPATCHER_ID_TS:-agent-dispatcher-ts-production}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-900}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_MAX_BACKOFF_SECONDS: ${OUTBOX_MAX_BACKOFF_SECONDS:-300}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]

  agent-worker-ts:
    build:
      context: ..
      dockerfile: infra/docker/agent-worker-ts.Dockerfile
    restart: unless-stopped
    environment:
      # 健康端点与版本接口使用的非敏感构建标识。
      APP_VERSION: ${APP_VERSION:?set APP_VERSION in .env.production}
      GIT_SHA: ${GIT_SHA:?set GIT_SHA in .env.production}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      AGENT_QUEUE_REDIS_URL: ${AGENT_QUEUE_REDIS_URL:?set AGENT_QUEUE_REDIS_URL in .env.production}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent.run}
      AGENT_SHORT_QUEUE_NAME: ${AGENT_SHORT_QUEUE_NAME:-agent.run}
      AGENT_LONG_QUEUE_NAME: ${AGENT_LONG_QUEUE_NAME:-agent.run.long}
      AGENT_QUEUE_PREFIX: ${AGENT_QUEUE_PREFIX:-learncraft:agent-queue}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      AGENT_SHORT_WORKER_CONCURRENCY: ${AGENT_SHORT_WORKER_CONCURRENCY:-2}
      AGENT_LONG_WORKER_CONCURRENCY: ${AGENT_LONG_WORKER_CONCURRENCY:-2}
      AGENT_JOB_MAX_ATTEMPTS: ${AGENT_JOB_MAX_ATTEMPTS:-3}
      AGENT_JOB_BACKOFF_MS: ${AGENT_JOB_BACKOFF_MS:-10000}
      AGENT_JOB_BACKOFF_MAX_MS: ${AGENT_JOB_BACKOFF_MAX_MS:-300000}
      AGENT_JOB_LOCK_DURATION_MS: ${AGENT_JOB_LOCK_DURATION_MS:-660000}
      CORE_INTERNAL_BASE_URL: http://web:3000/internal/v1
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env.production}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env.production}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:?set CREDENTIAL_ENCRYPTION_KEY_VERSION in .env.production}
      MODEL_GATEWAY_REQUEST_MAX_RETRIES: ${MODEL_GATEWAY_REQUEST_MAX_RETRIES:-2}
      MODEL_EGRESS_ENABLED: ${MODEL_EGRESS_ENABLED:?set MODEL_EGRESS_ENABLED in .env.production}
      MODEL_EGRESS_ENVIRONMENT: production
      MODEL_EGRESS_PROXY_URL: ${MODEL_EGRESS_PROXY_URL:?set MODEL_EGRESS_PROXY_URL in .env.production}
      MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS: ${MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_EGRESS_READ_TIMEOUT_SECONDS: ${MODEL_EGRESS_READ_TIMEOUT_SECONDS:-120}
      MODEL_EGRESS_MAX_RESPONSE_BYTES: ${MODEL_EGRESS_MAX_RESPONSE_BYTES:-4194304}
      MODEL_EGRESS_AUDIT_RETENTION_DAYS: ${MODEL_EGRESS_AUDIT_RETENTION_DAYS:-30}
    depends_on:
      web:
        condition: service_healthy
    # 与 队列 Redis 侧一致的宽限期：等待在途任务收尾，避免被强制中断后重复执行。
    stop_grace_period: 11m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private, egress]

networks:
  edge:
  private:
  egress: