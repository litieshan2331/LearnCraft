# LearnCraft 本地开发覆盖配置。
# 功能：必须与 compose.yaml 一起使用；将 Web 切换为 Next.js 开发服务器并挂载源码，以支持保存后的 Fast Refresh。

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.dev.Dockerfile
    environment:
      NODE_ENV: development
    volumes:
      # 挂载前端源码和跨语言契约；修改它们后无需重建镜像。
      - type: bind
        source: ../apps/web
        target: /app/apps/web
      - type: bind
        source: ../packages/contracts
        target: /app/packages/contracts
      # 保留镜像内由 pnpm 创建的依赖，并隔离 Next.js 开发缓存，避免写入宿主机。
      - type: volume
        source: web-dev-node-modules
        target: /app/apps/web/node_modules
      - type: volume
        source: web-dev-next-cache
        target: /app/apps/web/.next

volumes:
  web-dev-node-modules:
  web-dev-next-cache:
