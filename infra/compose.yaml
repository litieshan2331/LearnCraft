# LearnCraft 本地开发编排。
# 服务：PostgreSQL + pgvector、认证限流 Redis、队列 Redis（BullMQ）、MinIO、Web，以及 TypeScript 的
# Dispatcher（agent-dispatcher-ts）与 Worker（agent-worker-ts）。Python 运行时代码保留在 apps/agent-worker，
# 但已不再由本文件启动或配置。

name: ${COMPOSE_PROJECT_NAME:?copy .env.example to .env before starting Compose}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 仅供本机 VS Code 数据库工具访问，避免暴露给局域网。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

  redis:
    # P0 仅用于认证限流；固定版本以避免本地环境随 latest 漂移。
    image: redis:7.4.9-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --databases 1
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      # 仅供本机 Redis Insight/CLI 调试，避免暴露给局域网。
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  queue-redis:
    # 队列 Redis（BullMQ）：与认证限流 Redis 物理分离；两者各自仅启用 DB 0，通过键前缀区分用途。
    image: redis:7.4.9-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$QUEUE_REDIS_PASSWORD" --databases 1
    restart: unless-stopped
    environment:
      QUEUE_REDIS_PASSWORD: ${QUEUE_REDIS_PASSWORD:?set QUEUE_REDIS_PASSWORD in .env}
    volumes:
      - queue-redis-data:/data
    ports:
      # Redis 不是 HTTP 服务；此端口仅供本机 Redis Insight/CLI 调试队列使用。
      - "127.0.0.1:${QUEUE_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$QUEUE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  minio:
    # 仅用于本地 P0 开发；该固定旧镜像不能直接作为生产对象存储方案。
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      # 本机开发使用：9000 为 S3 API，9001 为 MinIO 管理控制台。
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [private]

  web:
    # 本地开发默认运行 Next.js 开发服务器，支持保存后的 Fast Refresh。
    image: learncraft-web:dev
    build:
      context: ..
      dockerfile: infra/docker/web.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set SESSION_COOKIE_SECURE in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # 实时进度订阅：订阅 Agent Worker 发布在队列 Redis 上的临时频道（不落库、不重放）。
      AGENT_PROGRESS_REDIS_URL: ${AGENT_PROGRESS_REDIS_URL:-redis://:${QUEUE_REDIS_PASSWORD}@queue-redis:6379/0}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    command:
      - sh
      - -c
      # node_modules 是命名卷，首次创建时从当时镜像的内容初始化，之后不会自动补新工作区包的链接。
      # 这里只在链接缺失时强制重链（pnpm 依据根 .modules.yaml 判定「已是最新」，不会自己发现），
      # 健康状态下走亚秒级快速路径，不影响日常重启。
      # exec 让 pnpm（进而 Next）接管信号，避免重启时被强杀。
      - test -e node_modules/@learncraft/security-primitives || pnpm install --frozen-lockfile --force; exec pnpm dev --hostname 0.0.0.0 --port 3000
    volumes:
      # 源码、契约与共享安全包变更直接同步到容器；依赖与 .next 缓存保留在 Docker 命名卷中。
      - type: bind
        source: ../apps/web
        target: /app/apps/web
      - type: bind
        source: ../packages/contracts
        target: /app/packages/contracts
      - type: bind
        source: ../packages/security-primitives
        target: /app/packages/security-primitives
      - type: volume
        source: web-dev-node-modules
        target: /app/apps/web/node_modules
      - type: volume
        source: web-dev-next-cache
        target: /app/apps/web/.next
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, private]

  agent-worker-ts:
    # TypeScript Agent Worker：消费 BullMQ 队列并执行 AgentRun，是当前唯一的 Agent 运行时。
    build:
      context: ..
      dockerfile: infra/docker/agent-worker-ts.dev.Dockerfile
    command:
      - sh
      - -c
      # node_modules 是命名卷（源码为 bind 挂载），依赖变更后必须先在容器内安装，否则新依赖缺失。
      # 末尾用 exec：让 node 取代 sh 成为 PID 1，否则 SIGTERM 只发给 sh，优雅关闭收不到信号，
      # Docker 会一直等到 stop_grace_period（11 分钟）才强杀。
      - pnpm install --frozen-lockfile --filter @learncraft/agent-worker-ts... && pnpm build && exec node dist/worker.js
    restart: unless-stopped
    environment:
      # 健康端点与版本接口使用的非敏感构建标识。
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 队列 Redis 与认证 Redis 物理隔离；键前缀 learncraft:agent-queue 与认证限流的 ratelimit: 前缀不共用。
      AGENT_QUEUE_REDIS_URL: redis://:${QUEUE_REDIS_PASSWORD}@queue-redis:6379/0
      AGENT_QUEUE_PREFIX: ${AGENT_QUEUE_PREFIX:-learncraft:agent-queue}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent.run}
      AGENT_SHORT_QUEUE_NAME: ${AGENT_SHORT_QUEUE_NAME:-agent.run}
      AGENT_LONG_QUEUE_NAME: ${AGENT_LONG_QUEUE_NAME:-agent.run.long}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-1}
      AGENT_SHORT_WORKER_CONCURRENCY: ${AGENT_SHORT_WORKER_CONCURRENCY:-1}
      AGENT_LONG_WORKER_CONCURRENCY: ${AGENT_LONG_WORKER_CONCURRENCY:-1}
      AGENT_JOB_LOCK_DURATION_MS: ${AGENT_JOB_LOCK_DURATION_MS:-660000}
      AGENT_JOB_MAX_ATTEMPTS: ${AGENT_JOB_MAX_ATTEMPTS:-3}
      AGENT_JOB_BACKOFF_MS: ${AGENT_JOB_BACKOFF_MS:-10000}
      AGENT_JOB_BACKOFF_MAX_MS: ${AGENT_JOB_BACKOFF_MAX_MS:-300000}
      CORE_INTERNAL_BASE_URL: http://web:3000/internal/v1
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
      MODEL_GATEWAY_REQUEST_MAX_RETRIES: ${MODEL_GATEWAY_REQUEST_MAX_RETRIES:-5}
      # 联网工具配置：配额按账户走队列 Redis 的独立键前缀 ratelimit:tavily:daily:。
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_SEARCH_MAX_RESULTS: ${TAVILY_SEARCH_MAX_RESULTS:-5}
      TAVILY_EXTRACT_TOP_RESULTS: ${TAVILY_EXTRACT_TOP_RESULTS:-2}
      TAVILY_EXTRACT_CHUNKS_PER_SOURCE: ${TAVILY_EXTRACT_CHUNKS_PER_SOURCE:-3}
      AGENT_TOOL_MAX_CALLS: ${AGENT_TOOL_MAX_CALLS:-6}
      # ReAct 轮数按工作流注入；plan 需要更多轮次完成 6-12 章路线。
      AGENT_REACT_MAX_TURNS_ASSESSMENT: ${AGENT_REACT_MAX_TURNS_ASSESSMENT:-5}
      AGENT_REACT_MAX_TURNS_POSTTEST: ${AGENT_REACT_MAX_TURNS_POSTTEST:-5}
      AGENT_REACT_MAX_TURNS_PLAN: ${AGENT_REACT_MAX_TURNS_PLAN:-10}
      AGENT_REACT_MAX_TURNS_CARD_CONTENT: ${AGENT_REACT_MAX_TURNS_CARD_CONTENT:-5}
      TAVILY_DAILY_TOOL_CALL_LIMIT: ${TAVILY_DAILY_TOOL_CALL_LIMIT:-20}
      TAVILY_QUOTA_REDIS_URL: redis://:${QUEUE_REDIS_PASSWORD}@queue-redis:6379/0
      TAVILY_QUOTA_KEY_PREFIX: ${TAVILY_QUOTA_KEY_PREFIX:-ratelimit:tavily:daily:}
      MODEL_EGRESS_ENABLED: ${MODEL_EGRESS_ENABLED:-false}
      MODEL_EGRESS_ENVIRONMENT: ${MODEL_EGRESS_ENVIRONMENT:-development}
      MODEL_EGRESS_PROXY_URL: ${MODEL_EGRESS_PROXY_URL:-}
      MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS: ${MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_EGRESS_READ_TIMEOUT_SECONDS: ${MODEL_EGRESS_READ_TIMEOUT_SECONDS:-120}
      MODEL_EGRESS_MAX_RESPONSE_BYTES: ${MODEL_EGRESS_MAX_RESPONSE_BYTES:-8388608}
      MODEL_EGRESS_AUDIT_RETENTION_DAYS: ${MODEL_EGRESS_AUDIT_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      web:
        condition: service_healthy
    # 关闭窗口覆盖 600 秒硬超时，不中断在飞任务。
    stop_grace_period: 11m
    volumes:
      - type: bind
        source: ../apps/agent-worker-ts
        target: /app/apps/agent-worker-ts
      - type: bind
        source: ../packages/security-primitives
        target: /app/packages/security-primitives
      - type: volume
        source: agent-worker-ts-node-modules
        target: /app/apps/agent-worker-ts/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private, egress]

  agent-dispatcher-ts:
    # TypeScript Dispatcher：按 run_type 路由领取 Outbox 并投递 BullMQ。
    build:
      context: ..
      dockerfile: infra/docker/agent-worker-ts.dev.Dockerfile
    command:
      - sh
      - -c
      # 同上：exec 保证 SIGTERM 能到达 node。
      - pnpm install --frozen-lockfile --filter @learncraft/agent-worker-ts... && pnpm build && exec node dist/dispatcher.js
    restart: unless-stopped
    environment:
      # 健康端点与版本接口使用的非敏感构建标识。
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENT_QUEUE_REDIS_URL: redis://:${QUEUE_REDIS_PASSWORD}@queue-redis:6379/0
      AGENT_QUEUE_PREFIX: ${AGENT_QUEUE_PREFIX:-learncraft:agent-queue}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-agent.run}
      AGENT_SHORT_QUEUE_NAME: ${AGENT_SHORT_QUEUE_NAME:-agent.run}
      AGENT_LONG_QUEUE_NAME: ${AGENT_LONG_QUEUE_NAME:-agent.run.long}
      # 多实例必须各自唯一，否则会互相覆盖 Outbox 状态。
      OUTBOX_DISPATCHER_ID: ${OUTBOX_DISPATCHER_ID_TS:-agent-dispatcher-ts}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-900}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: ../apps/agent-worker-ts
        target: /app/apps/agent-worker-ts
      - type: bind
        source: ../packages/security-primitives
        target: /app/packages/security-primitives
      - type: volume
        source: agent-worker-ts-node-modules
        target: /app/apps/agent-worker-ts/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]

networks:
  edge:
  # 本地 P0 调试服务通过显式 ports 绑定到 127.0.0.1。
  # 是否暴露给宿主机仍仅由各服务的 ports 决定。
  private: {}
  egress:

volumes:
  postgres-data:
  redis-data:
  queue-redis-data:
  minio-data:
  web-dev-node-modules:
  web-dev-next-cache:
  agent-worker-ts-node-modules: