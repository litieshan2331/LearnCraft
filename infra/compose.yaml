name: ${COMPOSE_PROJECT_NAME:?copy .env.example to .env before starting Compose}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 仅供本机 VS Code 数据库工具访问，避免暴露给局域网。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

  redis:
    # P0 仅用于认证限流；固定版本以避免本地环境随 latest 漂移。
    image: redis:7.4.9-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --databases 1
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      # 仅供本机 Redis Insight/CLI 调试，避免暴露给局域网。
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  celery-redis:
    # Celery Broker 与认证限流 Redis 分离；两者各自仅启用 DB 0，并通过键前缀区分内部用途。
    image: redis:7.4.9-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$CELERY_REDIS_PASSWORD" --databases 1
    restart: unless-stopped
    environment:
      CELERY_REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:?set CELERY_REDIS_PASSWORD in .env}
    volumes:
      - celery-redis-data:/data
    ports:
      # Celery 本身不是 HTTP 服务；此端口仅供本机 Redis Insight/CLI 调试队列使用。
      - "127.0.0.1:${CELERY_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$CELERY_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  minio:
    # 仅用于本地 P0 开发；该固定旧镜像不能直接作为生产对象存储方案。
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      # 本机开发使用：9000 为 S3 API，9001 为 MinIO 管理控制台。
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [private]

  web:
    # 本地开发默认运行 Next.js 开发服务器，支持保存后的 Fast Refresh。
    image: learncraft-web:dev
    build:
      context: ..
      dockerfile: infra/docker/web.dev.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set SESSION_COOKIE_SECURE in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      AGENT_INTERNAL_URL: http://agent-api:8000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # 源码和契约变更直接同步到容器；依赖与 .next 缓存保留在 Docker 命名卷中。
      - type: bind
        source: ../apps/web
        target: /app/apps/web
      - type: bind
        source: ../packages/contracts
        target: /app/packages/contracts
      - type: volume
        source: web-dev-node-modules
        target: /app/apps/web/node_modules
      - type: volume
        source: web-dev-next-cache
        target: /app/apps/web/.next
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, private]

  agent-api:
    build:
      context: ..
      dockerfile: infra/docker/agent-worker.Dockerfile
    command:
      - uvicorn
      - learncraft_agent.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      # Windows Docker 绑定挂载使用轮询，保证保存 Python 文件后触发 Uvicorn 重载。
      WATCHFILES_FORCE_POLLING: "true"
      CORE_INTERNAL_BASE_URL: http://web:3000/internal/v1
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 仅供本机独立调试 Worker 接口，不能从局域网访问。
      - "127.0.0.1:${AGENT_WORKER_HOST_PORT:-8000}:8000"
    volumes:
      # 仅挂载 Python 源码；依赖仍来自镜像，依赖变更需重新构建。
      - type: bind
        source: ../apps/agent-worker/src
        target: /app/src
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/health'); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [private]

  agent-dispatcher:
    build:
      context: ..
      dockerfile: infra/docker/agent-worker.Dockerfile
    command:
      - watchfiles
      - --filter
      - python
      - --ignore-permission-denied
      - --grace-period
      - "1"
      - --sigint-timeout
      - "30"
      - --target-type
      - command
      - learncraft-agent-dispatcher
      - /app/src
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${CELERY_REDIS_PASSWORD}@celery-redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-agent.run}
      CELERY_REDIS_KEY_PREFIX: ${CELERY_REDIS_KEY_PREFIX:-learncraft:celery:}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-660}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-480}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-600}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-3}
      CELERY_RETRY_BACKOFF_SECONDS: ${CELERY_RETRY_BACKOFF_SECONDS:-10}
      CELERY_RETRY_BACKOFF_MAX_SECONDS: ${CELERY_RETRY_BACKOFF_MAX_SECONDS:-300}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      OUTBOX_DISPATCHER_ID: ${OUTBOX_DISPATCHER_ID:-agent-dispatcher-local}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-900}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      # Windows Docker 绑定挂载使用轮询，保证保存 Python 文件后重启 Dispatcher 子进程。
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      celery-redis:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      # 只挂载 Python 源码；依赖仍来自镜像，依赖变更需重新构建。
      - type: bind
        source: ../apps/agent-worker/src
        target: /app/src
    networks: [private]

  agent-celery-worker:
    build:
      context: ..
      dockerfile: infra/docker/agent-worker.Dockerfile
    command:
      - watchfiles
      - --filter
      - python
      - --ignore-permission-denied
      - --grace-period
      - "1"
      - --sigint-timeout
      - "600"
      - --target-type
      - command
      - "celery -A learncraft_agent.core.celery_app:celery_app worker --loglevel=INFO"
      - /app/src
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Windows Docker 绑定挂载使用轮询，保证保存 Python 文件后重启 Celery Worker 子进程。
      WATCHFILES_FORCE_POLLING: "true"
      CELERY_BROKER_URL: redis://:${CELERY_REDIS_PASSWORD}@celery-redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-agent.run}
      CELERY_REDIS_KEY_PREFIX: ${CELERY_REDIS_KEY_PREFIX:-learncraft:celery:}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-660}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-480}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-600}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-3}
      CELERY_RETRY_BACKOFF_SECONDS: ${CELERY_RETRY_BACKOFF_SECONDS:-10}
      CELERY_RETRY_BACKOFF_MAX_SECONDS: ${CELERY_RETRY_BACKOFF_MAX_SECONDS:-300}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?set EMBEDDING_PROVIDER in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?set EMBEDDING_DIMENSION in .env}
      EMBEDDING_METRIC: ${EMBEDDING_METRIC:?set EMBEDDING_METRIC in .env}
      EMBEDDING_PROFILE_VERSION: ${EMBEDDING_PROFILE_VERSION:?set EMBEDDING_PROFILE_VERSION in .env}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MODEL_GATEWAY_REQUEST_MAX_RETRIES: ${MODEL_GATEWAY_REQUEST_MAX_RETRIES:-2}
      TAVILY_SEARCH_MAX_RESULTS: ${TAVILY_SEARCH_MAX_RESULTS:-5}
      TAVILY_EXTRACT_TOP_RESULTS: ${TAVILY_EXTRACT_TOP_RESULTS:-2}
      TAVILY_EXTRACT_CHUNKS_PER_SOURCE: ${TAVILY_EXTRACT_CHUNKS_PER_SOURCE:-3}
      AGENT_TOOL_MAX_CALLS: ${AGENT_TOOL_MAX_CALLS:-3}
      TAVILY_DAILY_TOOL_CALL_LIMIT: ${TAVILY_DAILY_TOOL_CALL_LIMIT:-20}
      TAVILY_QUOTA_REDIS_URL: redis://:${CELERY_REDIS_PASSWORD}@celery-redis:6379/0
      TAVILY_QUOTA_KEY_PREFIX: ${TAVILY_QUOTA_KEY_PREFIX:-ratelimit:tavily:daily:}
      MODEL_EGRESS_ENABLED: ${MODEL_EGRESS_ENABLED:-false}
      MODEL_EGRESS_ENVIRONMENT: ${MODEL_EGRESS_ENVIRONMENT:-development}
      MODEL_EGRESS_PROXY_URL: ${MODEL_EGRESS_PROXY_URL:-}
      MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS: ${MODEL_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_EGRESS_READ_TIMEOUT_SECONDS: ${MODEL_EGRESS_READ_TIMEOUT_SECONDS:-120}
      MODEL_EGRESS_MAX_RESPONSE_BYTES: ${MODEL_EGRESS_MAX_RESPONSE_BYTES:-4194304}
      MODEL_EGRESS_AUDIT_RETENTION_DAYS: ${MODEL_EGRESS_AUDIT_RETENTION_DAYS:-30}
      CORE_INTERNAL_BASE_URL: http://web:3000/internal/v1
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      celery-redis:
        condition: service_healthy
      web:
        condition: service_healthy
    stop_grace_period: 11m
    volumes:
      # 只挂载 Python 源码；依赖仍来自镜像，依赖变更需重新构建。
      - type: bind
        source: ../apps/agent-worker/src
        target: /app/src
    networks: [private, egress]

networks:
  edge:
  # 本地 P0 调试服务通过显式 ports 绑定到 127.0.0.1。
  # 是否暴露给宿主机仍仅由各服务的 ports 决定。
  private: {}
  egress:

volumes:
  postgres-data:
  redis-data:
  celery-redis-data:
  minio-data:
  web-dev-node-modules:
  web-dev-next-cache:
