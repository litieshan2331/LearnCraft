# LearnCraft 第一阶段 HTTP 契约。
# 本文件定义系统状态、认证、学习目标、AgentRun 和统一错误响应；不包含密钥、Session 原始 token 或 ORM 模型。
openapi: 3.1.0
info:
  title: LearnCraft Core API
  version: 0.1.0
  description: LearnCraft Web/Core 与 Python Agent Worker 共用的 HTTP 契约。
servers:
  - url: /
    description: 同域 Web 服务入口
tags:
  - name: 系统
    description: 无需登录的服务健康与版本信息接口
  - name: 认证
    description: 邮箱密码与不透明 Session 的认证接口
  - name: 学习画像
    description: 当前用户的学习画像与偏好接口
  - name: 学习目标
    description: 当前用户的学习目标接口
  - name: 模型连接
    description: 用户自带 OpenAI-compatible API 的加密连接设置；响应永不包含 API Key。
  - name: Planning
    description: 学习路线、章节目录与章节详情接口。
  - name: Content
    description: 节点知识内容生成与阅读接口。
  - name: Assessment
    description: 前测与路线后测的异步题集生成请求接口。
  - name: AgentRun
    description: 长任务的安全状态快照与协作式取消接口
  - name: 内部接口
    description: 仅限私有网络服务间调用的接口
paths:
  /api/v1/health:
    get:
      tags: [系统]
      summary: 获取 Web 服务健康状态
      description: 当前阶段只报告 Web 进程与基础运行时状态；接入 Docker 和数据库后再补充依赖项就绪检查。
      operationId: get_web_health
      security: []
      responses:
        '200':
          description: 服务可处理请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
  /api/v1/version:
    get:
      tags: [系统]
      summary: 获取 Web 服务版本信息
      description: 返回可安全公开的构建版本和 Git 提交标识，不返回环境变量、密钥或内部连接信息。
      operationId: get_web_version
      security: []
      responses:
        '200':
          description: 服务版本信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
  /api/v1/auth/register:
    post:
      tags: [认证]
      summary: 注册用户
      operationId: register_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功；不会创建 Session 或设置 Cookie，用户需另行登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '409':
          $ref: '#/components/responses/EmailAlreadyExists'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationRateLimitUnavailable'
  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 登录并创建 Session
      operationId: login_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationRateLimitUnavailable'
  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 注销当前 Session
      operationId: logout_user
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 已注销
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
  /api/v1/auth/me:
    get:
      tags: [认证]
      summary: 获取当前登录用户
      operationId: get_current_user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/learner-profile:
    get:
      tags: [学习画像]
      summary: 获取当前用户的学习者画像
      operationId: get_learner_profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者画像；首次尚未填写时 profile 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [学习画像]
      summary: 创建或更新当前用户的学习者画像
      operationId: upsert_learner_profile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerProfileUpsertRequest'
      responses:
        '200':
          description: 已保存的学习者画像；每次更新会递增 profile_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-goals:
    get:
      tags: [学习目标]
      summary: 查询当前用户的学习目标列表
      operationId: list_learning_goals
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 按最近更新时间倒序的当前用户学习目标；每项包含最新前测摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [学习目标]
      summary: 创建当前用户的学习目标
      operationId: create_learning_goal
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: 学习目标已创建，等待请求前测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '200':
          description: 同一幂等键重复请求，返回已创建的学习目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-goals/{goal_id}:
    get:
      tags: [学习目标]
      summary: 获取当前用户的单个学习目标
      operationId: get_learning_goal
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: 学习目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [学习目标]
      summary: 硬删除当前用户的学习目标
      description: 仅在目标不存在 queued 或 running AgentRun 时删除。请先取消活动任务，再重新发起删除。
      operationId: delete_learning_goal
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '204':
          description: 学习目标及其级联业务数据、AgentRun、AgentRun 事件和关联 Outbox 已删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GoalHasActiveRuns'
  /api/v1/learning-goals/{goal_id}/assessment-runs:
    post:
      tags: [Assessment]
      summary: 为学习目标创建前测生成 AgentRun
      description: 仅允许当前用户为自己的学习目标创建 assessment_generate 前测任务。前测需要 10-20 题；任务创建后通过 AgentRun 状态接口轮询，题集由 Worker 异步生成并回写 Web。
      operationId: create_assessment_generation_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentGenerationRequest'
      responses:
        '202':
          description: AgentRun 已创建并进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '200':
          description: 同一幂等键重复请求，返回已有 AgentRun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 未配置账户默认模型，或幂等键与已有任务内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-goals/{goal_id}/plans:
    post:
      tags: [Planning]
      summary: 在前测评分完成后创建学习路线生成 AgentRun
      description: 仅允许当前用户为自己的学习目标创建 plan_generate 任务。请求前必须存在已评分前测；任务创建后通过 AgentRun 状态接口轮询，并在成功时返回 learning_plan_id。
      operationId: create_learning_plan_generation_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGenerationRequest'
      responses:
        '202':
          description: AgentRun 已创建并进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '200':
          description: 同一幂等键重复请求，返回已有 AgentRun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 前测尚未评分、未配置默认模型连接，或幂等键与已有任务内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/learning-plans/{plan_id}:
    get:
      tags: [Planning]
      summary: 获取当前用户拥有的学习计划及章节目录
      description: 仅返回当前用户拥有的学习计划、路线元数据和按章节顺序排列的节点摘要。
      operationId: get_learning_plan
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: 学习计划详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}:
    get:
      tags: [Planning]
      summary: 获取当前用户拥有的单个学习章节
      description: 返回章节详情、所属学习计划状态及前置章节 ID。
      operationId: get_plan_node
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
      responses:
        '200':
          description: 学习章节详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/card-contents/{card_content_id}:
    get:
      tags: [Content]
      summary: 获取当前用户拥有的节点知识内容
      description: 仅返回状态为 ready 的公开节点知识内容和来源引用；不返回 teaching_memory、生成元数据或其他内部字段。
      operationId: get_card_content
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CardContentId'
      responses:
        '200':
          description: 已成功生成的节点知识内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}/completion:
    post:
      tags: [Planning]
      summary: 标记当前用户的学习章节完成
      description: 只记录用户的个人完成状态；不检查前置章节，不限制内容生成或节点后测。
      operationId: mark_plan_node_completed
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
      responses:
        '200':
          description: 已更新的学习章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}/content-runs:
    post:
      tags: [Content]
      summary: 为当前有效路线的节点创建知识内容生成 AgentRun
      description: 仅允许当前用户首次请求节点内容；节点已有成功内容时不创建第二次模型任务。失败内容可使用新的幂等键重试。
      operationId: create_card_content_generation_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardContentGenerationRequest'
      responses:
        '202':
          description: AgentRun 已创建并进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '200':
          description: 同一幂等键重复请求，返回已有 AgentRun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 节点内容已经可用、正在生成，或未配置账户默认模型连接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}/post-assessment-runs:
    post:
      tags: [Assessment]
      summary: 为学习节点创建后测生成 AgentRun
      description: 仅允许当前用户为拥有 ready 节点内容的 plan_node 创建 posttest_generate 任务；节点完成标记只作个人进度记录，不构成后测条件。后测需要 5-10 题，并由 Worker 绑定该节点的 source_card_content_id；任务创建后通过 AgentRun 状态接口轮询。
      operationId: create_posttest_generation_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosttestGenerationRequest'
      responses:
        '202':
          description: AgentRun 已创建并进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '200':
          description: 同一幂等键重复请求，返回已有 AgentRun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前后测正在生成、最新后测尚未交卷、未配置账户默认模型，或幂等键与已有任务内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}/post-assessments:
    get:
      tags: [Assessment]
      summary: 获取章节已有的后测题集列表
      description: 返回当前用户指定章节下已生成的 post_test 题集及最近一次作答摘要；不会返回题目答案或解析。
      operationId: list_node_post_assessments
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
      responses:
        '200':
          description: 节点后测列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosttestAssessmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-nodes/{node_id}/post-assessment-attempts:
    get:
      tags: [Assessment]
      summary: 获取章节下所有后测作答记录
      description: 返回当前用户指定章节下已完成后测的评分摘要；每套后测只允许一次作答，posttest_no 表示该节点下第几套后测。
      operationId: list_node_post_assessment_attempts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PlanNodeId'
      responses:
        '200':
          description: 节点后测作答记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosttestAssessmentAttemptList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assessments/{assessment_id}:
    get:
      tags: [Assessment]
      summary: 获取当前用户拥有的单个题集
      description: 仅返回作答所需的题干、选项和题集元数据；不返回答案、解析、评分规则或生成元数据。
      operationId: get_assessment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 可供作答的题集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assessments/{assessment_id}/attempts:
    get:
      tags: [Assessment]
      summary: 获取当前用户在题集下的历史作答摘要
      operationId: list_assessment_attempts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 当前题集已评分的历史作答，按作答序号倒序返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttemptList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Assessment]
      summary: 提交完整选择答案并完成确定性评分
      description: 仅可提交题集中的全部单选题一次。服务端根据生成题集时已保存的答案键评分；成功响应才包含正确答案和解析，不会额外调用模型。
      operationId: submit_assessment_attempt
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentAttemptSubmissionRequest'
      responses:
        '201':
          description: 作答已保存并完成评分。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '200':
          description: 同一幂等键安全重试，返回原有评分结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 题集不可提交、已提交，或幂等键与不同答案冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/assessment-attempts/{attempt_id}:
    get:
      tags: [Assessment]
      summary: 获取单次作答的评分详情和错题解析
      operationId: get_assessment_attempt
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AssessmentAttemptId'
      responses:
        '200':
          description: 仅向作答所有者返回提交后的答案、正确答案、解析和得分。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/model-connections:
    get:
      tags: [模型连接]
      summary: 获取当前用户的模型连接列表
      operationId: list_model_connections
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 不含 API Key 的模型连接列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnectionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [模型连接]
      summary: 加密保存一个 OpenAI-compatible 模型连接
      description: 连接保存阶段拒绝 localhost、.local、回环和常见局域网 IP；真实 Worker 调用前仍必须完成 P1 的 DNS、重定向与受控出网防护。API Key 仅可写入，响应和日志不会返回该字段。
      operationId: create_model_connection
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConnectionCreateRequest'
      responses:
        '201':
          description: 已加密保存模型连接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '409':
          description: 当前用户的连接名称重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: 凭据加密主密钥尚未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/model-connections/{model_connection_id}:
    patch:
      tags: [模型连接]
      summary: 更新当前用户的模型连接
      operationId: update_model_connection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ModelConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConnectionUpdateRequest'
      responses:
        '200':
          description: 已更新；若提交 API Key，会加密覆盖旧凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前用户的连接名称重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: 凭据加密主密钥尚未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [模型连接]
      summary: 删除当前用户的模型连接
      operationId: delete_model_connection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ModelConnectionId'
      responses:
        '204':
          description: 已删除；目标和历史任务的可选关联会置空。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/model-connections/{model_connection_id}/default:
    post:
      tags: [模型连接]
      summary: 设置账户默认模型连接
      operationId: set_default_model_connection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ModelConnectionId'
      responses:
        '200':
          description: 已设置账户默认连接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/agent-runs/{agent_run_id}:
    get:
      tags: [AgentRun]
      summary: 获取当前用户可见的 AgentRun 状态
      operationId: get_agent_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: AgentRun 安全状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/agent-runs/{agent_run_id}/cancel:
    post:
      tags: [AgentRun]
      summary: 协作式取消当前用户的 AgentRun
      description: 仅能取消 `queued` 或 `running` 任务。系统立即持久化 `cancelled` 状态，Worker 会在当前工作流边界检查该状态并停止后续步骤；不能强制中断已经发出的模型 Provider 请求。重复取消已取消任务返回当前状态快照。
      operationId: cancel_agent_run
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: 已接受取消请求，或任务此前已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentRunNotCancellable'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/agent-runs/{agent_run_id}/card-content-context:
    get:
      tags: [内部接口]
      summary: Worker 读取节点后测固定内容上下文
      description: 仅允许 Agent Worker 读取指定 posttest_generate 任务绑定的 ready CardContent 和 teaching_memory。
      operationId: get_card_content_context
      x-internal: true
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: 后测固定内容上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardContentContext'
        '400':
          $ref: '#/components/responses/InternalBadRequest'
        '401':
          $ref: '#/components/responses/InternalAuthenticationFailed'
        '404':
          $ref: '#/components/responses/InternalNotFound'
        '422':
          $ref: '#/components/responses/InternalValidationError'
  /internal/v1/agent-runs/{agent_run_id}/card-content-result:
    post:
      tags: [内部接口]
      summary: Worker 回写已校验的节点知识内容
      description: 仅允许 Agent Worker 在私有网络中调用；结果必须绑定 card_content_generate AgentRun 的 plan_node。
      operationId: submit_card_content_result
      x-internal: true
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardContentGenerationResult'
      responses:
        '200':
          description: 节点内容已幂等持久化
          content:
            application/json:
              schema:
                type: object
                required: [card_content_id, status]
                properties:
                  card_content_id:
                    type: string
                    format: uuid
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/InternalBadRequest'
        '401':
          $ref: '#/components/responses/InternalAuthenticationFailed'
        '404':
          $ref: '#/components/responses/InternalNotFound'
        '422':
          $ref: '#/components/responses/InternalValidationError'
  /internal/v1/agent-runs/{agent_run_id}/default-model-connection:
    get:
      tags: [内部接口]
      summary: Worker 读取账户默认模型连接与加密凭据
      description: 仅允许 Agent Worker 在私有网络中调用。credential 为 AES-256-GCM 密文（AAD 为 learncraft:model-connection:{owner_id}），明文 API Key 只在 Worker 进程内解密使用，不得写入日志、队列或 AgentRun。
      operationId: get_default_model_connection
      x-internal: true
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: 账户默认模型连接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultModelConnectionEnvelope'
        '400':
          $ref: '#/components/responses/InternalBadRequest'
        '401':
          $ref: '#/components/responses/InternalAuthenticationFailed'
        '404':
          $ref: '#/components/responses/InternalNotFound'
  /internal/v1/agent-runs/{agent_run_id}/assessment-result:
    post:
      tags: [内部接口]
      summary: Worker 回写已校验的前测或后测题集
      description: 仅允许 Agent Worker 在私有网络中调用，且只接受 assessment_generate 或 posttest_generate 的 AgentRun。所有字段为 snake_case 且不接受额外字段。交叉校验：diagnostic 的 question_count 必须为 10-20 且不得携带 plan_id、plan_node_id、source_card_content_id；post_test 的 question_count 必须为 5-10、必须携带 plan_node_id 与 source_card_content_id 且不得携带 plan_id；questions 长度必须等于 question_count。重复调用按 generation_metadata.agent_run_id 幂等。实现见 apps/web/src/app/internal/v1/agent-runs/[agentRunId]/assessment-result/route.ts。
      operationId: submit_assessment_result
      x-internal: true
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentResultSubmission'
      responses:
        '200':
          description: 题集已幂等持久化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistedAssessmentEnvelope'
        '400':
          $ref: '#/components/responses/InternalBadRequest'
        '401':
          $ref: '#/components/responses/InternalAuthenticationFailed'
        '404':
          $ref: '#/components/responses/InternalNotFound'
        '422':
          $ref: '#/components/responses/InternalValidationError'
  /internal/v1/agent-runs/{agent_run_id}/plan-result:
    post:
      tags: [内部接口]
      summary: Worker 回写已校验的学习路线
      description: 仅允许 Agent Worker 在私有网络中调用，且只接受 plan_generate 的 AgentRun（target_type 必须是 learning_goal 且 target_id 与 goal_id 一致）。所有字段为 snake_case 且不接受额外字段。nodes 必须为 6-12 项，node_key 与 ordinal 唯一、ordinal 从 1 连续编号、前置节点必须存在于本路线且不能自依赖、依赖图必须无环；输入快照中的 learner_profile.profile_version 必须为正整数。重复调用按 generation_metadata.agent_run_id 幂等。实现见 apps/web/src/app/internal/v1/agent-runs/[agentRunId]/plan-result/route.ts。
      operationId: submit_plan_result
      x-internal: true
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningPlanResultSubmission'
      responses:
        '200':
          description: 学习路线已幂等持久化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistedLearningPlanEnvelope'
        '400':
          $ref: '#/components/responses/InternalBadRequest'
        '401':
          $ref: '#/components/responses/InternalAuthenticationFailed'
        '404':
          $ref: '#/components/responses/InternalNotFound'
        '422':
          $ref: '#/components/responses/InternalValidationError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lc_session
      description: 浏览器 HttpOnly Session Cookie；原始 token 不出现在响应 JSON 或日志中。
    internalServiceToken:
      type: apiKey
      in: header
      name: X-LearnCraft-Internal-Secret
      description: 仅用于 Web 与 Agent Worker 的私有服务认证；取值来自环境变量 INTERNAL_SERVICE_SECRET，Web 侧使用长度比较与 timingSafeEqual 校验。
  headers:
    SessionCookie:
      description: 不透明 Session Cookie。生产环境必须带 Secure 与 HttpOnly 属性。
      schema:
        type: string
    ClearedSessionCookie:
      description: 失效的 Session Cookie。
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 防止重复创建产生状态或模型成本的资源。
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      description: 学习目标 ID。
      schema:
        type: string
        format: uuid
    PlanId:
      name: plan_id
      in: path
      required: true
      description: 学习计划 ID。
      schema:
        type: string
        format: uuid
    CardContentId:
      name: card_content_id
      in: path
      required: true
      description: 节点知识内容 ID。
      schema:
        type: string
        format: uuid
    PlanNodeId:
      name: node_id
      in: path
      required: true
      description: 学习路线节点 ID。
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: agent_run_id
      in: path
      required: true
      description: AgentRun ID。
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: assessment_id
      in: path
      required: true
      description: 题集 ID。
      schema:
        type: string
        format: uuid
    AssessmentAttemptId:
      name: attempt_id
      in: path
      required: true
      description: 题集作答 ID。
      schema:
        type: string
        format: uuid
    ModelConnectionId:
      name: model_connection_id
      in: path
      required: true
      description: 当前用户的模型连接 ID。
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 未登录、Session 无效或已过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalAuthenticationFailed:
      description: 内部服务身份校验失败（UNAUTHORIZED）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
    InternalBadRequest:
      description: 请求参数或请求体不合法（INVALID_AGENT_RUN_ID、INVALID_JSON）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
    InternalNotFound:
      description: 目标资源不存在（AGENT_RUN_NOT_FOUND、DEFAULT_MODEL_CONNECTION_NOT_FOUND、CARD_CONTENT_CONTEXT_NOT_FOUND 等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
    InternalValidationError:
      description: 请求体不符合契约（VALIDATION_ERROR 等），field_errors 为校验问题列表。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
    NotFound:
      description: 资源不存在或当前用户无权读取。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 请求字段不符合接口契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EmailAlreadyExists:
      description: 邮箱已被注册。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: 邮箱或密码错误，不能暴露具体错误原因。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: 同一幂等键与不同请求内容发生冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GoalHasActiveRuns:
      description: 学习目标仍有排队或运行中的 AgentRun，必须先取消后才可硬删除。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AgentRunNotCancellable:
      description: AgentRun 已成功、失败或过期，不能再取消。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求频率超过当前限制。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidOrigin:
      description: 认证写请求的 Origin 不在允许的同域 Web 来源中。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationRateLimitUnavailable:
      description: Redis 认证限流服务不可用。为避免绕过防暴力破解限制，请求被安全拒绝。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ServiceStatusResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, git_sha]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: 服务当前是否可处理请求；数据库等依赖就绪检查接入后可返回 degraded。
        service:
          type: string
          enum: [web, agent-worker]
          description: 返回该响应的服务标识；当前两个 `/api/v1` 接口固定为 web。
        version:
          type: string
          maxLength: 100
          description: 应用版本，例如 0.1.0。
        git_sha:
          type: string
          maxLength: 100
          description: 构建对应的 Git 提交标识；本地未注入时可返回 unknown。
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, profile_completed]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        profile_completed:
          type: boolean
    LearnerProfileUpsertRequest:
      type: object
      additionalProperties: false
      required: [current_level, weekly_minutes, content_preference]
      properties:
        current_level:
          type: string
          enum: [beginner, intermediate, advanced]
          description: 用户整体编程经验，不针对某一种编程语言或技术主题。
        weekly_minutes:
          type: integer
          minimum: 30
          maximum: 10080
        operating_system:
          type: string
          enum: [windows, macos, linux, other]
          nullable: true
        background_summary:
          type: string
          maxLength: 2000
          nullable: true
        content_preference:
          type: string
          enum: [document_first, video_first, balanced]
    LearnerProfile:
      type: object
      additionalProperties: false
      required:
        - current_level
        - primary_language
        - weekly_minutes
        - content_preference
        - profile_version
        - created_at
        - updated_at
      properties:
        current_level:
          type: string
          enum: [beginner, intermediate, advanced]
          description: 用户整体编程经验，不针对某一种编程语言或技术主题。
        primary_language:
          type: string
          enum: [zh-CN]
        weekly_minutes:
          type: integer
          minimum: 30
          maximum: 10080
        operating_system:
          type: string
          enum: [windows, macos, linux, other]
          nullable: true
        background_summary:
          type: string
          nullable: true
        content_preference:
          type: string
          enum: [document_first, video_first, balanced]
        profile_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LearnerProfileResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          allOf:
            - $ref: '#/components/schemas/LearnerProfile'
          nullable: true
    GoalCreateRequest:
      type: object
      additionalProperties: false
      required: [topic, title, description, desired_outcome]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 200
