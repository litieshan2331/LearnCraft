          maxLength: 100
        trace_id:
          type: string
          maxLength: 128
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: 稳定的机器可读错误码。
        message:
          type: string
          description: 面向用户的安全中文提示。
        trace_id:
          type: string
          description: 用于日志关联的追踪 ID，不包含敏感信息。
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
    FieldValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    InternalErrorResponse:
      type: object
      additionalProperties: true
      required: [error]
      description: 内部接口（/internal/v1）的错误响应体，与公共 API 的对象信封不同：error 是稳定的字符串错误码，校验失败时通过 field_errors 返回 Zod 问题列表。
      properties:
        error:
          type: string
          description: 稳定错误码，例如 UNAUTHORIZED、INVALID_AGENT_RUN_ID、INVALID_JSON、VALIDATION_ERROR、AGENT_RUN_NOT_FOUND、DEFAULT_MODEL_CONNECTION_NOT_FOUND、CARD_CONTENT_CONTEXT_NOT_FOUND。
        field_errors:
          type: array
          description: 仅在校验失败时出现。
          items:
            type: object
            additionalProperties: true
    DefaultModelConnectionEnvelope:
      type: object
      additionalProperties: false
      required: [owner_id, connection_id, base_url, model_id, credential]
      properties:
        owner_id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        base_url:
          type: string
          maxLength: 2048
        model_id:
          type: string
          maxLength: 255
        credential:
          $ref: '#/components/schemas/EncryptedModelCredential'
    EncryptedModelCredential:
      type: object
      additionalProperties: false
      required: [ciphertext_base64, iv_base64, auth_tag_base64, encryption_key_version]
      description: AES-256-GCM 密文的三段 Base64 编码与密钥版本；AAD 固定为 learncraft:model-connection:{owner_id}，加密与解密由 Web 与 Agent Worker 共用同一份实现。
      properties:
        ciphertext_base64:
          type: string
          minLength: 1
        iv_base64:
          type: string
          minLength: 1
          description: 12 字节随机 IV 的 Base64 编码。
        auth_tag_base64:
          type: string
          minLength: 1
          description: 16 字节认证标签的 Base64 编码（独立存储，不与密文拼接）。
        encryption_key_version:
          type: string
          minLength: 1
          maxLength: 50
    AssessmentResultSubmission:
      type: object
      additionalProperties: false
      required: [kind, question_count, difficulty, schema_version, questions]
      description: 前测与后测共用的回写载荷；skill_tags 与 max_score 在服务端有默认值，questions 长度必须等于 question_count。
      properties:
        kind:
          type: string
          enum:
            - diagnostic
            - post_test
        question_count:
          type: integer
          minimum: 5
          maximum: 20
        difficulty:
          type: string
          enum:
            - normal
            - hard
        schema_version:
          type: string
          enum:
            - assessment.single_choice.v1
        plan_id:
          type: string
          format: uuid
          nullable: true
        plan_node_id:
          type: string
          format: uuid
          nullable: true
        source_card_content_id:
          type: string
          format: uuid
          nullable: true
        questions:
          type: array
          minItems: 5
          maxItems: 20
          items:
            $ref: '#/components/schemas/AssessmentResultQuestion'
        generation_metadata:
          type: object
          additionalProperties: true
          default: {}
    AssessmentResultQuestion:
      type: object
      additionalProperties: false
      required: [prompt, options, answer_key, explanation]
      description: answer_key 必须引用 options 中已存在的 key；skill_tags 默认空数组，max_score 默认 1。
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/AssessmentOption'
        answer_key:
          type: string
          pattern: '^[A-F]$'
        explanation:
          type: string
          minLength: 1
          maxLength: 2000
        skill_tags:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 100
        max_score:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
    LearningPlanResultSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, title, summary, nodes]
      description: 学习路线回写载荷；nodes 必须为 6-12 项且 ordinal 从 1 连续编号。
      properties:
        schema_version:
          type: string
          enum:
            - learning_plan.v1
        title:
          type: string
          minLength: 1
          maxLength: 255
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        nodes:
          type: array
          minItems: 6
          maxItems: 12
          items:
            $ref: '#/components/schemas/LearningPlanResultNode'
        generation_metadata:
          type: object
          additionalProperties: true
          default: {}
    LearningPlanResultNode:
      type: object
      additionalProperties: false
      required: [node_key, ordinal, title, node_brief, learning_objective, rationale, difficulty, estimated_minutes, completion_criteria]
      description: prerequisite_node_keys 默认空数组、最多 11 项；同一路线内 node_key 与 ordinal 必须唯一，前置节点必须存在且不能自依赖，依赖图必须无环。
      properties:
        node_key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]*$'
        ordinal:
          type: integer
          minimum: 1
          maximum: 12
        title:
          type: string
          minLength: 1
          maxLength: 255
        node_brief:
          type: string
          minLength: 1
          maxLength: 2000
        learning_objective:
          type: string
          minLength: 1
          maxLength: 2000
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        estimated_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        prerequisite_node_keys:
          type: array
          maxItems: 11
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-z][a-z0-9_]*$'
        completion_criteria:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1000
    PersistedAssessmentEnvelope:
      type: object
      additionalProperties: false
      required: [assessment_id, status, question_count]
      properties:
        assessment_id:
          type: string
          format: uuid
        status:
          type: string
          minLength: 1
          maxLength: 30
        question_count:
          type: integer
          minimum: 1
          maximum: 20
    PersistedLearningPlanEnvelope:
      type: object
      additionalProperties: false
      required: [learning_plan_id, node_count]
      properties:
        learning_plan_id:
          type: string
          format: uuid
        node_count:
          type: integer
          minimum: 6
          maximum: 12
