[project]
name = "learncraft-agent"
version = "0.1.0"
description = "LearnCraft 的 FastAPI 与 LangGraph Agent Worker"
readme = "README.md"
authors = [
    { name = "litieshan2", email = "1176345357@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.0,<5.7.0",
    "cryptography>=46.0.5,<47",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.28,<2",
    "orjson>=3.11.9",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
learncraft-agent = "learncraft_agent.main:main"
learncraft-agent-dispatcher = "learncraft_agent.infrastructure.queue.dispatcher:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
